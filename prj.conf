# Bluetooth 主机配置
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# 大 MTU（0x84 帧 242 字节，需协商到 247 才能一次写完）
# NCS 2.5.0 用 L2CAP TX MTU + ACL RX/TX 缓冲控制（没有 BT_ATT_TX_MAX）
# ⚠️ ACL_RX_SIZE 是隐藏变量：默认 27 → RX_MTU=23 → 协商死锁！
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=255

# 长写（prepare write）缓冲，0=禁用长写
CONFIG_BT_ATT_PREPARE_COUNT=8

# 日志输出
CONFIG_PRINTK=y
